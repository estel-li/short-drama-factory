name: Publish version

on:
  push:
    branches: [main]
    paths:
      - app/version.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-version
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Compile application
        run: python -m compileall -q app launcher tools pipeline.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Frontend regression checks
        run: npm test
      - name: Check API contract
        run: python tools/generate_agent_contract.py --check
      - name: Build portable application
        run: python launcher/build_portable.py
      - name: Verify and prepare release assets
        run: python tools/package_release.py
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read application version.' }
          $metadata = Get-Content -LiteralPath "dist/release-$version/release.json" -Raw | ConvertFrom-Json
          gh release create "v$version" @($metadata.assets) --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title $metadata.title --notes-file $metadata.notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the existing draft before retrying.' }
